<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Confirm your email</title>
  </head>
  <body style="margin:0;padding:0;background:#f6f4ef;font-family:Arial,sans-serif;color:#171717;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f6f4ef;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background:#ffffff;border-radius:8px;padding:32px;">
            <tr>
              <td>
                <h1 style="margin:0 0 16px;font-size:24px;line-height:1.25;color:#171717;">
                  Confirm your email
                </h1>

                <p style="margin:0 0 20px;font-size:16px;line-height:1.6;color:#333333;">
                  Thanks for signing up. Please confirm your email address to finish creating your account.
                </p>

                <p style="margin:0 0 28px;">
                  <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#171717;color:#ffffff;text-decoration:none;font-size:16px;font-weight:bold;padding:14px 22px;border-radius:6px;">
                    Confirm email
                  </a>
                </p>

                <p style="margin:0 0 12px;font-size:14px;line-height:1.6;color:#666666;">
                  If the button does not work, copy and paste this link into your browser:
                </p>

                <p style="margin:0 0 24px;font-size:14px;line-height:1.6;word-break:break-all;color:#666666;">
                  {{ .ConfirmationURL }}
                </p>

                <p style="margin:0;font-size:14px;line-height:1.6;color:#666666;">
                  If you did not create an account, you can safely ignore this email.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
